<!doctype html>
<!--
  med.kattabaza.uz uchun "tez orada" slaydlari (servis hali yo'q — rasmini chizamiz).
  Time va treyler slaydlari esa haqiqiy platformalardan olinadi: tools/slides/capture.mjs.
  Ko'rish: brauzerda oching, oxiriga ?theme=light#med-1 yoki ?theme=dark#med-2 qo'shing.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }

  :root {
    --bg: #06100f; --glow: rgba(45, 212, 191, .22); --glow2: rgba(59, 130, 246, .15);
    --text: #f0fdfa; --accent: #5eead4; --accent-strong: #14b8a6; --line: rgba(45, 212, 191, .35);
    --grid: rgba(255, 255, 255, .035); --card: rgba(6, 16, 15, .82); --win: #0d1817; --side: #0a1312;
    --tile: #18181c; --muted: #8f8f99; --ecg: rgba(45, 212, 191, .35); --shadow: rgba(0, 0, 0, .6);
  }
  body.light {
    --bg: #f3fbfa; --glow: rgba(20, 184, 166, .20); --glow2: rgba(59, 130, 246, .10);
    --text: #0b2a27; --accent: #0d9488; --accent-strong: #14b8a6; --line: rgba(13, 148, 136, .35);
    --grid: rgba(13, 42, 39, .05); --card: rgba(255, 255, 255, .88); --win: #ffffff; --side: #f4faf9;
    --tile: #eef6f5; --muted: #5b7470; --ecg: rgba(13, 148, 136, .30); --shadow: rgba(13, 42, 39, .18);
  }

  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .slide { display: none; position: absolute; inset: 0; overflow: hidden; }
  .slide:target { display: block; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: radial-gradient(ellipse at center, #000 40%, transparent 85%); }
  .mono { font-family: "JetBrains Mono", Consolas, monospace; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 999px; background: rgba(45, 212, 191, .14); color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .win { position: absolute; inset: 0; display: flex; border-radius: 18px; background: var(--win); border: 1px solid var(--line); overflow: hidden; }
  .side { width: 196px; background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 3px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; margin: 0 6px 16px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-strong); color: #ecfeff; display: grid; place-items: center; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: 13px; color: var(--muted); }
  .nav.on { background: rgba(45, 212, 191, .14); color: var(--accent); }
  .main { flex: 1; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; }
  .tile { flex: 1; height: 110px; border-radius: 14px; background: var(--tile); }
  .panel { border-radius: 14px; background: var(--tile); }
</style>
<script>
  if (new URLSearchParams(location.search).get("theme") === "light") {
    document.addEventListener("DOMContentLoaded", () => document.body.classList.add("light"));
  }
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></symbol>
    <symbol id="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></symbol>
  </defs>
</svg>

<!-- ============================ MED 1: Coming soon ============================ -->
<section class="slide" id="med-1">
  <div style="position:absolute; inset:0; background:
      radial-gradient(700px 480px at 50% 40%, var(--glow), transparent 65%),
      radial-gradient(600px 400px at 100% 100%, var(--glow2), transparent 60%), var(--bg);"></div>
  <div class="grid"></div>
  <svg viewBox="0 0 1280 720" style="position:absolute; inset:0">
    <path d="M0 625 H170 L205 575 L250 690 L295 540 L335 625 H1280" fill="none" stroke="var(--ecg)" stroke-width="3" stroke-linejoin="round"/>
  </svg>
  <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
    <div style="width:128px; height:128px; border-radius:36px; background:linear-gradient(145deg,#2dd4bf,#0d9488); display:grid; place-items:center; box-shadow:0 0 80px rgba(45,212,191,.45), 0 30px 60px var(--shadow);">
      <svg viewBox="0 0 24 24" style="width:66px;height:66px" fill="#ecfeff"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>
    </div>
    <div class="mono" style="margin-top:34px; font-size:20px; color:var(--accent); letter-spacing:.02em">med.kattabaza.uz</div>
    <div style="margin-top:10px; font-size:76px; font-weight:800; letter-spacing:-.03em">Coming soon</div>
    <div style="margin-top:14px;"><span class="pill"><span class="dot"></span>In development</span></div>
  </div>
</section>

<!-- ============================ MED 2: Preview ============================ -->
<section class="slide" id="med-2">
  <div style="position:absolute; inset:0; background:radial-gradient(800px 500px at 20% 0%, var(--glow), transparent 60%), var(--bg);"></div>
  <div style="position:absolute; left:80px; top:70px; width:1120px; height:580px; filter:blur(3px); opacity:.55;">
    <div class="win">
      <div class="side">
        <div class="brand"><span class="logo"><svg class="i"><use href="#pulse"/></svg></span>Med</div>
        <div class="nav on"><svg class="i"><use href="#home"/></svg>Overview</div>
        <div class="nav"><svg class="i"><use href="#cal"/></svg>Appointments</div>
        <div class="nav"><svg class="i"><use href="#users"/></svg>Patients</div>
        <div class="nav"><svg class="i"><use href="#file"/></svg>Records</div>
      </div>
      <div class="main">
        <div class="row"><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
        <div class="row" style="flex:1"><div class="panel" style="flex:1.4"></div><div class="panel" style="flex:1"></div></div>
      </div>
    </div>
  </div>
  <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
    <div style="background:var(--card); border:1px solid var(--line); border-radius:24px; padding:34px 46px; text-align:center; box-shadow:0 30px 80px var(--shadow);">
      <svg viewBox="0 0 24 24" style="width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>
      <div style="font-size:38px; font-weight:800; margin-top:10px">We are building it</div>
      <div class="mono" style="margin-top:8px; color:var(--accent); font-size:16px">med.kattabaza.uz</div>
      <div style="margin:22px auto 0; width:320px; height:8px; border-radius:99px; background:var(--grid); overflow:hidden;"><div style="width:35%; height:100%; background:linear-gradient(90deg,#2dd4bf,#5eead4); border-radius:99px"></div></div>
    </div>
  </div>
</section>

</body>
</html>
